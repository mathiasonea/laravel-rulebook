<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Laravel Rulebook social preview</title>
  <desc id="description">Business rules change. Old decisions still need to make sense.</desc>

  <rect width="1280" height="640" fill="#0a0a0a"/>
  <rect width="16" height="640" fill="#d7ff3f"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="68" fill="#d7ff3f" font-size="18" font-weight="700" letter-spacing="2">LARAVEL / RULEBOOK</text>
    <text x="1216" y="68" fill="#8d8d86" font-size="15" text-anchor="end" letter-spacing="1">CODE-DEFINED BUSINESS RULES</text>

    <line x1="64" y1="96" x2="1216" y2="96" stroke="#3a3a36" stroke-width="2"/>

    <text x="60" y="205" fill="#f4f2e9" font-size="82" font-weight="700">BUSINESS RULES</text>
    <text x="60" y="294" fill="#f4f2e9" font-size="82" font-weight="700">CHANGE.</text>

    <rect x="62" y="333" width="754" height="51" fill="#d7ff3f"/>
    <path d="M816 333 H852 L816 384Z" fill="#d7ff3f"/>
    <text x="78" y="368" fill="#0a0a0a" font-size="25" font-weight="700">OLD DECISIONS STILL NEED TO MAKE SENSE.</text>

    <text x="934" y="178" fill="#74746e" font-family="Menlo, Monaco, monospace" font-size="15">$rulebook</text>
    <text x="934" y="213" fill="#f4f2e9" font-family="Menlo, Monaco, monospace" font-size="24" font-weight="700">-&gt;resolveAt(</text>
    <text x="966" y="249" fill="#a7a7a0" font-family="Menlo, Monaco, monospace" font-size="18">$subject,</text>
    <text x="966" y="280" fill="#d7ff3f" font-family="Menlo, Monaco, monospace" font-size="18">$at</text>
    <text x="1020" y="280" fill="#70706b" font-family="Menlo, Monaco, monospace" font-size="13">// 2026-06-15</text>
    <text x="934" y="316" fill="#f4f2e9" font-family="Menlo, Monaco, monospace" font-size="24" font-weight="700">);</text>
  </g>

  <g transform="translate(64 455)" font-family="Menlo, Monaco, monospace">
    <text x="0" y="-23" fill="#70706b" font-size="13" letter-spacing="1">RULE HISTORY / EFFECTIVE DATE</text>

    <line x1="0" y1="22" x2="1152" y2="22" stroke="#51514c" stroke-width="2"/>

    <rect x="0" y="14" width="16" height="16" fill="#f4f2e9"/>
    <text x="0" y="68" fill="#8d8d86" font-size="16">2025</text>
    <text x="0" y="92" fill="#5e5e59" font-size="13">HISTORICAL</text>

    <rect x="420" y="0" width="312" height="110" fill="#d7ff3f"/>
    <path d="M420 0 L444 -24 H756 L732 0Z" fill="#d7ff3f"/>
    <text x="446" y="37" fill="#0a0a0a" font-size="16" font-weight="700">2026 / SELECTED</text>
    <text x="446" y="67" fill="#0a0a0a" font-size="13">ONE WINNER</text>
    <text x="446" y="90" fill="#0a0a0a" font-size="13">COMPLETE EVALUATION</text>

    <rect x="1136" y="14" width="16" height="16" fill="#f4f2e9"/>
    <text x="1152" y="68" fill="#8d8d86" font-size="16" text-anchor="end">2027</text>
    <text x="1152" y="92" fill="#5e5e59" font-size="13" text-anchor="end">FUTURE</text>
  </g>

  <g font-family="Menlo, Monaco, monospace" font-size="13">
    <text x="64" y="609" fill="#6d6d67">github.com/mathiasonea/laravel-rulebook</text>
    <text x="1216" y="609" fill="#d7ff3f" text-anchor="end">TIME-AWARE / DETERMINISTIC / EXPLAINABLE</text>
  </g>
</svg>
